name: Keep Streamlit awake

# Resets the sleep timer on the Streamlit Community Cloud.
on:
  schedule:
    - cron: "0 */8 * * *"     # every 8h (3x/day) -- comfortably under the 12h sleep window
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Load the app (a real browser session resets the sleep timer)
        env:
          APP_URL: https://phantom-wallet-intelligence.streamlit.app
        run: |
          python - <<'PY'
          import os, re
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, timeout=120_000, wait_until="domcontentloaded")

              # If asleep, Community Cloud shows a wake button. count() is a non-waiting
              # snapshot -- the button usually isn't rendered yet at that instant, so wait
              # for it instead. Label has varied across Streamlit versions -> match loosely.
              wake = page.get_by_role("button", name=re.compile("get this app back up|wake", re.I))
              try:
                  wake.wait_for(state="visible", timeout=30_000)
                  print("app was asleep; clicking wake")
                  wake.click()
              except PWTimeout:
                  print("no wake button; app was already awake")

              # Confirm the backend rendered the dashboard (cold boot after wake can be slow).
              try:
                  page.wait_for_selector("text=Cohort", timeout=240_000)
                  print("app is awake:", page.title())
              except PWTimeout:
                  page.screenshot(path="keepalive-debug.png", full_page=True)
                  print("RENDER FAILED -- title:", page.title())
                  print(page.inner_text("body")[:1500])
                  raise
              finally:
                  browser.close()
          PY
      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-debug
          path: keepalive-debug.png
          if-no-files-found: ignore
