name: Keep Streamlit awake

# Resets the sleep timer on the Streamlit Community Cloud.
on:
  schedule:
    - cron: "0 */8 * * *"     # every 8h (3x/day) -- comfortably under the 12h sleep window
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Load the app (a real browser session resets the sleep timer)
        env:
          APP_URL: https://phantom-wallet-intelligence.streamlit.app
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, timeout=120_000)
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count() > 0:                      # app was asleep -> wake it
                  print("app was asleep; clicking wake")
                  wake.click()
                  page.wait_for_timeout(60_000)
              page.wait_for_selector("text=Cohort", timeout=120_000)   # proves the backend rendered
              print("app is awake:", page.title())
              browser.close()
          PY
