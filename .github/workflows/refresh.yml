name: Monthly data refresh

# Rolls the window forward, rebuilds the snapshot from Dune, and commits it back (which redeploys the
# Streamlit app). Run the first one manually via "Run workflow" to validate and measure Dune credits.
on:
  schedule:
    - cron: "0 6 1 * *"        # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}         # manual trigger

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write               # commit the refreshed snapshot back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90         # extraction is Dune-queue-bound; generous ceiling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild snapshot from Dune
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          PYTHONUNBUFFERED: "1"     # stream logs live (CI has no TTY)
        run: |
          mkdir -p data
          python extract.py
          python features.py
          python model.py
          python export_demo.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/demo.duckdb
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
          else
            git commit -m "chore: monthly data refresh $(date -u +%F)"
            git push
          fi
